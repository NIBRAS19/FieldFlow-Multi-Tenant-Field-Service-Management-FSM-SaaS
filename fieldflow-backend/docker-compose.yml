services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: fieldflow
      POSTGRES_USER: fieldflow
      POSTGRES_PASSWORD: fieldflow
    ports:
      - "5432:5432"
    volumes:
      - fieldflow_db:/var/lib/postgresql/data
  api:
    build: .
    depends_on:
      - db
    environment:
      DJANGO_SECRET_KEY: local-dev-secret
      DJANGO_DEBUG: "true"
      DJANGO_ALLOWED_HOSTS: 127.0.0.1,localhost,api
      DATABASE_URL: postgresql://fieldflow:fieldflow@db:5432/fieldflow
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - fieldflow_media:/app/media
volumes:
  fieldflow_db:
  fieldflow_media:
